<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Helen</title>
<style>
  :root { --bg: #0b0d10; --fg: #f4f1ea; --dim: #8a8f98; --me: #7cc4ff; --them: #ffd27c; --hit: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  body { display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  #status { font-size: 14px; color: var(--dim); }
  #morse { margin: 20px 0 8px; min-height: 96px; border-radius: 18px; background: #161a20;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px;
    transition: background .06s; }
  #morse.flash { background: var(--hit); }
  #words { font-size: 30px; font-weight: 700; letter-spacing: .08em; }
  #code { font: 16px/1.3 ui-monospace, Menlo, monospace; color: var(--dim); word-break: break-all; text-align: center; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
  .line { padding: 10px 14px; border-radius: 14px; max-width: 88%; }
  .them { background: #2a2416; color: var(--them); align-self: flex-start; }
  .me { background: #142433; color: var(--me); align-self: flex-end; }
  .who { font-size: 12px; opacity: .7; display: block; }
  .controls { display: flex; gap: 10px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 16px; border: 0; border-radius: 14px;
    background: #222831; color: var(--fg); }
  #start { background: #f4f1ea; color: #0b0d10; font-size: 20px; padding: 22px; }
  .hidden { display: none !important; }
  #logs { margin-top: 10px; background: #050607; border-radius: 12px; padding: 8px 10px;
    font: 12px/1.45 ui-monospace, Menlo, monospace; color: #9aa3ad; height: 32vh; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word; }
  #logs .tap { color: #c9d1d9; } #logs .say { color: var(--me); } #logs .heard { color: var(--them); }
  #logs .err { color: #ff8a8a; }
  #logsToggle { flex: 0 0 auto; }
</style>
</head>
<body>
<header><h1>Helen</h1><span id="status">not connected</span></header>

<button id="start">Tap to start</button>

<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="morse"><div id="words">&nbsp;</div><div id="code"></div></div>
  <div id="log"></div>
  <button id="talk" style="width:100%;margin-bottom:10px;padding:22px;font-size:20px;background:#3a3f47;-webkit-user-select:none;user-select:none">Press ▶ Start conversation</button>
  <div class="controls" style="margin-bottom:10px">
    <button id="startConv" style="background:#2e7d4f">▶ Start conversation</button>
    <button id="resetConv" style="background:#7a2e2e">↺ Reset</button>
  </div>
  <div class="controls">
    <button id="replay">Replay</button>
    <button id="test">Test buzz</button>
    <button id="logsToggle">Logs</button>
  </div>
  <div id="logs"></div>
</div>

<script>
// ---- Haptics -------------------------------------------------------------------------
// iPhone (iOS 18+): flipping a hidden "switch" makes the Taptic Engine tick.
// Android: navigator.vibrate. A dot is one tick, a dash two quick ticks
// (the same as the band input: tap = dot, double-tap = dash).
const canVibrate = typeof navigator.vibrate === "function";
function tick() {
  if (canVibrate) { navigator.vibrate(40); return; }
  const label = document.createElement("label");
  label.ariaHidden = "true";
  label.style.display = "none";
  const input = document.createElement("input");
  input.type = "checkbox";
  input.setAttribute("switch", "");
  label.appendChild(input);
  document.head.appendChild(label);
  label.click();
  document.head.removeChild(label);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

const morseBox = document.getElementById("morse");

// One strong buzz of `ms` milliseconds: a long vibration on Android, a burst of rapid
// Taptic ticks on iPhone (one tick alone is too faint to notice).
async function buzzFor(ms) {
  morseBox.classList.add("flash");
  if (canVibrate) {
    navigator.vibrate(ms);
    await sleep(ms);
  } else {
    const end = performance.now() + ms;
    while (performance.now() < end) { tick(); await sleep(28); }
  }
  morseBox.classList.remove("flash");
}

// Play [[on_ms, off_ms], ...] pulses (built by the server, so it knows how long this takes).
let playing = Promise.resolve();
function playPattern(pulses) {
  playing = playing.then(async () => {
    for (const [on, off] of pulses) { await buzzFor(on); await sleep(off); }
  });
}

// Morse text -> pulses (same timing as server/helen/buzz.py), for Test buzz and older events.
const DOT = 120, DASH = 360, GAP = 160, LETTER = 420, WORD = 800;
function morsePulses(morse) {
  const out = [];
  for (const word of morse.split(" / ")) {
    for (const letter of word.split(" ")) {
      for (const s of letter) out.push([s === "-" ? DASH : DOT, GAP]);
      if (out.length) out[out.length - 1][1] = LETTER;
    }
    if (out.length) out[out.length - 1][1] = WORD;
  }
  return out;
}
let lastMorse = "";
function playMorse(morse) { lastMorse = morse; playPattern(morsePulses(morse)); }

// ---- Voice ---------------------------------------------------------------------------
const voice = new Audio();
voice.playsInline = true;
let voiceQueue = Promise.resolve();
function playVoice(url, after) {
  voiceQueue = voiceQueue.then(() => new Promise(done => {
    voice.src = url;
    voice.onended = voice.onerror = () => { done(); if (after) after(); };
    voice.play().catch(() => { done(); if (after) after(); });
  }));
}

// ---- Conversation --------------------------------------------------------------------
const log = document.getElementById("log");
function addLine(who, text) {
  const div = document.createElement("div");
  div.className = "line " + (who === "me" ? "me" : "them");
  div.innerHTML = `<span class="who">${who === "me" ? "Helen user (tapped)" : "They said"}</span>`;
  div.appendChild(document.createTextNode(text));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ---- Live server logs ----------------------------------------------------------------
const logs = document.getElementById("logs");
function addLog(line) {
  const div = document.createElement("div");
  div.className = /SAYING|TAPPED/.test(line) ? "say" : /HEARD|FEEL/.test(line) ? "heard"
    : /!!!|Problem|Error/.test(line) ? "err" : "tap";
  div.textContent = line;
  const atBottom = logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 20;
  logs.appendChild(div);
  while (logs.children.length > 300) logs.removeChild(logs.firstChild);
  if (atBottom) logs.scrollTop = logs.scrollHeight;
}
document.getElementById("logsToggle").onclick = () => logs.classList.toggle("hidden");

// ---- Link to the laptop --------------------------------------------------------------
const status = document.getElementById("status");
function connect() {
  const events = new EventSource("/events");
  events.onopen = () => status.textContent = "connected";
  events.onerror = () => status.textContent = "reconnecting…";
  events.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "log") addLog(ev.line);
    if (ev.type === "finish" && listening && spoke) finish();   // the band heard the sentence end
    if (ev.type === "end") { conversationOn = false; endAfterVoice = true; }   // Shri said goodbye
    if (ev.type === "reset") {
      log.innerHTML = "";
      document.getElementById("words").innerHTML = "&nbsp;";
      document.getElementById("code").textContent = "";
    }
    if (ev.type === "heard") addLine("them", ev.text);
    if (ev.type === "feel") {
      document.getElementById("words").textContent = ev.words.replace(/ Q$/, " ?");
      document.getElementById("code").textContent = ev.morse;
      playMorse(ev.morse);
    }
    if (ev.type === "buzz") {          // voice-agent demo: buzz now, Sri speaks when it ends
      document.getElementById("words").textContent = ev.words;
      document.getElementById("code").textContent = "";
      playPattern(ev.pattern);
    }
    if (ev.type === "say") {
      addLine("me", ev.text);
      if (ev.audio) {
        stopListening();
        releaseMic();
        showStatus("🔊 Shri is speaking…", "#2e7d4f");
        const turn = ++voiceTurn;      // only the newest reply may reopen the mic
        playVoice(ev.audio, async () => {
          if (endAfterVoice) { endAfterVoice = false; showStatus("✅ Conversation ended. Press ↺ Reset for another take", "#3a3f47"); return; }
          if (turn !== voiceTurn || !conversationOn) return;
          if (await openMic() && turn === voiceTurn) setTimeout(listen, 300);
        });
      }
    }
  };
}

document.getElementById("start").onclick = () => {
  // A first touch unlocks sound and haptics on the iPhone.
  tick();
  voice.src = "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq";
  voice.play().catch(() => {});
  document.getElementById("start").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  connect();
};
function action(name, body) { fetch("/action/" + name, { method: "POST", body: body || "" }).catch(() => {}); }

// ---- Hands-free conversation through the phone's microphone ------------------------------
// The mic is opened once, on the Start tap (iOS only allows it from a tap). Each turn is
// recorded; when the sound level drops for 1.5 s after speech, the recording goes to the
// laptop, which transcribes it (Deepgram) and lets Sri answer. While Sri talks we don't record.
const talk = document.getElementById("talk");
let micStream = null, audioCtx = null, analyser = null, recorder = null, chunks = [];
let voiceTurn = 0, endAfterVoice = false;
let listening = false, conversationOn = false, spoke = false, lastLoud = 0, turnStart = 0, floor = 0.01, levelTimer = null;
let peak = 0, speechStart = 0;
function showStatus(text, color) { talk.textContent = text; talk.style.background = color; }
function debug(msg) { action("debug", msg); }

async function openMic() {
  if (micStream) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    try { await audioCtx.resume(); } catch (e) {}
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    micStream = stream;
    debug("mic open");
    return true;
  } catch (e) {
    if (e.name !== "NotAllowedError") { debug("mic retry: " + e.message); return false; }
    showStatus("⚠️ Microphone blocked: allow it in Safari (aA → Website Settings → Microphone)", "#a82b2b");
    debug("mic blocked: " + e.name + " " + e.message);
    return false;
  }
}
// Close the mic while Sri talks: with the mic open, iPhones play sound through the quiet earpiece.
function releaseMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}
function level() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (const v of buf) sum += v * v;
  return Math.sqrt(sum / buf.length);
}
function listen() {
  if (!conversationOn || listening || !micStream) return;
  listening = true; spoke = false; chunks = []; turnStart = performance.now(); peak = 0; speechStart = 0;
  try {
    recorder = new MediaRecorder(micStream);
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = sendTurn;
    recorder.start(250);
  } catch (e) { debug("recorder failed: " + e.message); listening = false; return; }
  showStatus("🎤 Listening… (speak now)", "#2b5ea8");
  // learn the room's background level for the first 0.6 s, then watch for speech and the pause
  const samples = [];
  levelTimer = setInterval(() => {
    const l = level(), now = performance.now();
    if (now - turnStart < 600) { samples.push(l); floor = Math.max(0.004, samples.reduce((a, b) => a + b, 0) / samples.length); return; }
    // "Talking" = clearly above the room's noise AND near this speaker's own loudness, so a
    // noisy room still counts as a pause once the speaker stops.
    if (spoke) peak = Math.max(peak * 0.995, l);
    const loud = l > floor * 2.5 + 0.008 && (!spoke || l > peak * 0.35);
    if (loud) {
      lastLoud = now;
      if (!spoke) { spoke = true; speechStart = now; peak = l; showStatus("🎤 Hearing you… (tap when done)", "#2b5ea8"); }
    }
    if (spoke && now - lastLoud > 800) finish();              // 0.8 s pause after speech: done
    if (spoke && now - speechStart > 5000) finish();          // at most 5 s per turn
    if (now - turnStart > 25000) finish();                    // safety: never record forever
  }, 100);
}
function stopListening() {
  clearInterval(levelTimer);
  listening = false;
  if (recorder && recorder.state !== "inactive") { recorder.onstop = null; recorder.stop(); }
  recorder = null;
}
function finish() {
  if (!listening) return;
  clearInterval(levelTimer);
  listening = false;
  showStatus("📳 Shri is feeling it…", "#6b4fa8");
  if (recorder && recorder.state !== "inactive") recorder.stop(); else sendTurn();
}
function sendTurn() {
  const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/mp4" });
  recorder = null;
  fetch("/action/audio", { method: "POST", headers: { "Content-Type": blob.type || "audio/mp4" }, body: blob }).catch(() => {});
}
talk.addEventListener("click", () => { if (listening) finish(); });

document.getElementById("startConv").onclick = async () => {
  if (!(await openMic())) return;
  conversationOn = true; stopListening(); showStatus("🔊 Shri is speaking…", "#2e7d4f"); action("start");
};
document.getElementById("resetConv").onclick = () => { conversationOn = false; stopListening(); releaseMic(); showStatus("Press ▶ Start conversation", "#3a3f47"); action("reset"); };
document.getElementById("replay").onclick = () => lastMorse && playMorse(lastMorse);
document.getElementById("test").onclick = () => playMorse("... --- ...");
</script>

<!-- ElevenLabs agent demo: open the page with ?agent. You talk to "Sri" (an ElevenLabs
     Conversational AI agent); every time you finish saying something, the phone vibrates. -->
<script type="module">
if (location.hash === "#agent" || new URLSearchParams(location.search).has("agent")) {
  const AGENT_ID = "agent_0501m7ed1sfsfe294sscwpvehxq1";
  document.body.innerHTML = `
    <header><h1>Helen</h1><span id="astatus">ready</span></header>
    <div id="abox" style="margin:20px 0;min-height:120px;border-radius:18px;background:#161a20;display:flex;
         align-items:center;justify-content:center;padding:16px;text-align:center;font-size:22px;transition:background .06s">
      Talk with Sri, a deafblind hackathon attendee</div>
    <div id="alog" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0"></div>
    <button id="astart" style="width:100%;padding:24px;font-size:22px;background:#2e7d4f">▶ Start conversation</button>
    <button id="astop" style="width:100%;padding:16px;margin-top:10px;background:#7a2e2e;display:none">■ End</button>`;
  const box = document.getElementById("abox"), st = document.getElementById("astatus"), alog = document.getElementById("alog");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const canVibrate = typeof navigator.vibrate === "function";
  function tick() {   // iPhone (iOS 18+): a hidden switch flip makes the Taptic Engine tick
    const label = document.createElement("label"); label.style.display = "none";
    const input = document.createElement("input"); input.type = "checkbox"; input.setAttribute("switch", "");
    label.appendChild(input); document.head.appendChild(label); label.click(); document.head.removeChild(label);
  }
  // A strong buzz pattern (~2 s): bursts of rapid ticks on iPhone, real vibration on Android.
  async function vibrate() {
    const pattern = [[300, 150], [120, 150], [120, 150], [300, 150], [120, 150], [300, 0]];
    if (canVibrate) navigator.vibrate(pattern.flat());
    for (const [on, off] of pattern) {
      box.style.background = "#ffffff";
      const end = performance.now() + on;
      while (performance.now() < end) { if (!canVibrate) tick(); await sleep(28); }
      box.style.background = "#161a20";
      await sleep(off);
    }
  }
  function line(who, text) {
    const d = document.createElement("div");
    d.style.cssText = "padding:10px 14px;border-radius:14px;max-width:88%;" + (who === "user"
      ? "background:#2a2416;color:#ffd27c;align-self:flex-start" : "background:#142433;color:#7cc4ff;align-self:flex-end");
    d.textContent = (who === "user" ? "You: " : "Sri: ") + text;
    alog.appendChild(d); alog.scrollTop = alog.scrollHeight;
  }
  const report = msg => fetch("/action/debug", { method: "POST", body: msg }).catch(() => {});
  let conversation = null;
  document.getElementById("astart").onclick = async () => {
    tick();                                           // unlock haptics with this tap
    st.textContent = "connecting…";
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
      const { Conversation } = await import("https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm");
      conversation = await Conversation.startSession({
        agentId: AGENT_ID,
        connectionType: "websocket",
        onConnect: () => { st.textContent = "connected"; report("agent connected"); },
        onDisconnect: () => { st.textContent = "ended"; },
        onError: e => { st.textContent = "error"; report("agent error: " + (e && e.message || e)); },
        onModeChange: m => { box.textContent = m.mode === "speaking" ? "🔊 Shri is speaking…" : "🎤 Listening…"; },
        onMessage: m => {
          line(m.source === "user" ? "user" : "ai", m.message);
          report((m.source === "user" ? "YOU: " : "SRI: ") + m.message);
          if (m.source === "user") vibrate();           // you spoke: Sri feels it on the phone
        },
      });
      document.getElementById("astart").style.display = "none";
      document.getElementById("astop").style.display = "block";
    } catch (e) {
      st.textContent = "could not start"; box.textContent = "⚠️ " + (e.message || e); report("agent start failed: " + (e.message || e));
    }
  };
  document.getElementById("astop").onclick = async () => {
    if (conversation) await conversation.endSession();
    document.getElementById("astop").style.display = "none";
    document.getElementById("astart").style.display = "block";
  };
}
</script>
</body>
</html>
