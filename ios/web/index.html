<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Helen</title>
<style>
  :root { --bg: #0b0d10; --fg: #f4f1ea; --dim: #8a8f98; --me: #7cc4ff; --them: #ffd27c; --hit: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  body { display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  #status { font-size: 14px; color: var(--dim); }
  #morse { margin: 20px 0 8px; min-height: 96px; border-radius: 18px; background: #161a20;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px;
    transition: background .06s; }
  #morse.flash { background: var(--hit); }
  #words { font-size: 30px; font-weight: 700; letter-spacing: .08em; }
  #code { font: 16px/1.3 ui-monospace, Menlo, monospace; color: var(--dim); word-break: break-all; text-align: center; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
  .line { padding: 10px 14px; border-radius: 14px; max-width: 88%; }
  .them { background: #2a2416; color: var(--them); align-self: flex-start; }
  .me { background: #142433; color: var(--me); align-self: flex-end; }
  .who { font-size: 12px; opacity: .7; display: block; }
  .controls { display: flex; gap: 10px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 16px; border: 0; border-radius: 14px;
    background: #222831; color: var(--fg); }
  #start { background: #f4f1ea; color: #0b0d10; font-size: 20px; padding: 22px; }
  .hidden { display: none !important; }
  #logs { margin-top: 10px; background: #050607; border-radius: 12px; padding: 8px 10px;
    font: 12px/1.45 ui-monospace, Menlo, monospace; color: #9aa3ad; height: 32vh; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word; }
  #logs .tap { color: #c9d1d9; } #logs .say { color: var(--me); } #logs .heard { color: var(--them); }
  #logs .err { color: #ff8a8a; }
  #logsToggle { flex: 0 0 auto; }
</style>
</head>
<body>
<header><h1>Helen</h1><span id="status">not connected</span></header>

<button id="start">Tap to start</button>

<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="morse"><div id="words">&nbsp;</div><div id="code"></div></div>
  <div id="log"></div>
  <button id="talk" style="width:100%;margin-bottom:10px;padding:26px;font-size:22px;background:#2b5ea8;-webkit-user-select:none;user-select:none;touch-action:none">🎤 Hold to talk</button>
  <div class="controls" style="margin-bottom:10px">
    <button id="startConv" style="background:#2e7d4f">▶ Start conversation</button>
    <button id="resetConv" style="background:#7a2e2e">↺ Reset</button>
  </div>
  <div class="controls">
    <button id="replay">Replay</button>
    <button id="test">Test buzz</button>
    <button id="logsToggle">Logs</button>
  </div>
  <div id="logs"></div>
</div>

<script>
// ---- Haptics -------------------------------------------------------------------------
// iPhone (iOS 18+): flipping a hidden "switch" makes the Taptic Engine tick.
// Android: navigator.vibrate. A dot is one tick, a dash two quick ticks
// (the same as the band input: tap = dot, double-tap = dash).
const canVibrate = typeof navigator.vibrate === "function";
function tick() {
  if (canVibrate) { navigator.vibrate(40); return; }
  const label = document.createElement("label");
  label.ariaHidden = "true";
  label.style.display = "none";
  const input = document.createElement("input");
  input.type = "checkbox";
  input.setAttribute("switch", "");
  label.appendChild(input);
  document.head.appendChild(label);
  label.click();
  document.head.removeChild(label);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

const morseBox = document.getElementById("morse");

// One strong buzz of `ms` milliseconds: a long vibration on Android, a burst of rapid
// Taptic ticks on iPhone (one tick alone is too faint to notice).
async function buzzFor(ms) {
  morseBox.classList.add("flash");
  if (canVibrate) {
    navigator.vibrate(ms);
    await sleep(ms);
  } else {
    const end = performance.now() + ms;
    while (performance.now() < end) { tick(); await sleep(28); }
  }
  morseBox.classList.remove("flash");
}

// Play [[on_ms, off_ms], ...] pulses (built by the server, so it knows how long this takes).
let playing = Promise.resolve();
function playPattern(pulses) {
  playing = playing.then(async () => {
    for (const [on, off] of pulses) { await buzzFor(on); await sleep(off); }
  });
}

// Morse text -> pulses (same timing as server/helen/buzz.py), for Test buzz and older events.
const DOT = 120, DASH = 360, GAP = 160, LETTER = 420, WORD = 800;
function morsePulses(morse) {
  const out = [];
  for (const word of morse.split(" / ")) {
    for (const letter of word.split(" ")) {
      for (const s of letter) out.push([s === "-" ? DASH : DOT, GAP]);
      if (out.length) out[out.length - 1][1] = LETTER;
    }
    if (out.length) out[out.length - 1][1] = WORD;
  }
  return out;
}
let lastMorse = "";
function playMorse(morse) { lastMorse = morse; playPattern(morsePulses(morse)); }

// ---- Voice ---------------------------------------------------------------------------
const voice = new Audio();
voice.playsInline = true;
let voiceQueue = Promise.resolve();
function playVoice(url) {
  voiceQueue = voiceQueue.then(() => new Promise(done => {
    voice.src = url;
    voice.onended = voice.onerror = done;
    voice.play().catch(done);
  }));
}

// ---- Conversation --------------------------------------------------------------------
const log = document.getElementById("log");
function addLine(who, text) {
  const div = document.createElement("div");
  div.className = "line " + (who === "me" ? "me" : "them");
  div.innerHTML = `<span class="who">${who === "me" ? "Helen user (tapped)" : "They said"}</span>`;
  div.appendChild(document.createTextNode(text));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ---- Live server logs ----------------------------------------------------------------
const logs = document.getElementById("logs");
function addLog(line) {
  const div = document.createElement("div");
  div.className = /SAYING|TAPPED/.test(line) ? "say" : /HEARD|FEEL/.test(line) ? "heard"
    : /!!!|Problem|Error/.test(line) ? "err" : "tap";
  div.textContent = line;
  const atBottom = logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 20;
  logs.appendChild(div);
  while (logs.children.length > 300) logs.removeChild(logs.firstChild);
  if (atBottom) logs.scrollTop = logs.scrollHeight;
}
document.getElementById("logsToggle").onclick = () => logs.classList.toggle("hidden");

// ---- Link to the laptop --------------------------------------------------------------
const status = document.getElementById("status");
function connect() {
  const events = new EventSource("/events");
  events.onopen = () => status.textContent = "connected";
  events.onerror = () => status.textContent = "reconnecting…";
  events.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "log") addLog(ev.line);
    if (ev.type === "reset") {
      log.innerHTML = "";
      document.getElementById("words").innerHTML = "&nbsp;";
      document.getElementById("code").textContent = "";
    }
    if (ev.type === "heard") addLine("them", ev.text);
    if (ev.type === "feel") {
      document.getElementById("words").textContent = ev.words.replace(/ Q$/, " ?");
      document.getElementById("code").textContent = ev.morse;
      playMorse(ev.morse);
    }
    if (ev.type === "buzz") {          // voice-agent demo: buzz now, Sri speaks when it ends
      document.getElementById("words").textContent = ev.words;
      document.getElementById("code").textContent = "";
      playPattern(ev.pattern);
    }
    if (ev.type === "say") {
      addLine("me", ev.text);
      if (ev.audio) playVoice(ev.audio);
    }
  };
}

document.getElementById("start").onclick = () => {
  // A first touch unlocks sound and haptics on the iPhone.
  tick();
  voice.src = "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq";
  voice.play().catch(() => {});
  document.getElementById("start").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  connect();
};
function action(name, body) { fetch("/action/" + name, { method: "POST", body: body || "" }).catch(() => {}); }

// ---- Hold to talk: the person speaks into the phone ----------------------------------
// While held, the phone's own speech recognition writes down what is said (when the
// browser allows it); on release the text goes to the laptop, which buzzes and lets Sri answer.
const talk = document.getElementById("talk");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, said = "", holding = false;
function startTalk(e) {
  e.preventDefault();
  if (holding) return;
  holding = true; said = "";
  talk.textContent = "🔴 Listening… release when done"; talk.style.background = "#a82b2b";
  if (Recognition) {
    try {
      rec = new Recognition(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
      rec.onresult = ev => { said = Array.from(ev.results).map(r => r[0].transcript).join(" "); talk.textContent = "🔴 " + said; };
      rec.start();
    } catch (err) { rec = null; }
  }
}
function endTalk(e) {
  e.preventDefault();
  if (!holding) return;
  holding = false;
  talk.textContent = "🎤 Hold to talk"; talk.style.background = "#2b5ea8";
  const send = () => action("spoke", said.trim());
  if (rec) { rec.onend = send; try { rec.stop(); } catch (err) { send(); } setTimeout(() => { if (rec) { rec.onend = null; rec = null; } }, 1500); }
  else send();
}
talk.addEventListener("touchstart", startTalk); talk.addEventListener("touchend", endTalk);
talk.addEventListener("mousedown", startTalk); talk.addEventListener("mouseup", endTalk);
document.getElementById("startConv").onclick = () => action("start");
document.getElementById("resetConv").onclick = () => action("reset");
document.getElementById("replay").onclick = () => lastMorse && playMorse(lastMorse);
document.getElementById("test").onclick = () => playMorse("... --- ...");
</script>
</body>
</html>
